services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: devverse
      POSTGRES_PASSWORD: devverse
      POSTGRES_DB: devverse
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devverse"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://devverse:devverse@db:5432/devverse
      REDIS_URL: redis://redis:6379/0

      SECRET_KEY: ${SECRET_KEY}
      DEBUG: "false"
      ENVIRONMENT: production

      FRONTEND_URL: https://areebkhan.dev
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      GITHUB_REDIRECT_URI: https://areebkhan.dev/api/v1/auth/github/callback

    volumes:
      - ./backend:/app
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://areebkhan.dev
    ports:
      - "3001:3000"
    environment:
      NEXT_PUBLIC_API_URL: https://areebkhan.dev
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
